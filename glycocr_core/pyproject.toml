[project]
name = "glycocr"
version = "0.1.0"
authors = [{ name = "Tom Stanton", email = "tomdstanton@gmail.com" }]
description = "GlycOCR: Vision Model for converting SNFG to IUPAC"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
keywords = ["bioinformatics", "genomics", "serotyping", "microbiology"]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "orjson>=3.11.9",
    "peft>=0.12.0",
]

[project.optional-dependencies]
data = [
    "glycowork>=1.0.0",
    "numpy>=1.24.0",
]
inference = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.45.0,<4.50.0",
    "peft>=0.10.0",
    "huggingface-hub>=0.23.0",
    "einops>=0.7.0,<0.8.0",
    "timm>=0.9.0",
    "pymupdf>=1.20.0",
    "glycocr[data]",
]
train = [
    "kornia>=0.7.0",
    "glycocr[inference]",
]
all = [
    "glycocr[train]",
]

[dependency-groups]
test = [
    "karva",
    "pytest-cov",
]
dev = [
    "glycocr[train]",
    { include-group = "test" },
]

[project.urls]
Homepage = "https://github.com/tomdstanton/GlycOCR"
Repository = "https://github.com/tomdstanton/GlycOCR"
Documentation = "https://github.com/tomdstanton/GlycOCR"
"Bug Tracker" = "https://github.com/tomdstanton/GlycOCR/issues"
Changelog = "https://github.com/tomdstanton/GlycOCR/blob/master/CHANGELOG.md"

[project.scripts]
glycocr = "glycocr.cli:app"

[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "Cargo.toml"
python-source = "../src"
module-name = "glycocr_rs"
features = ["pyo3/extension-module"]

[tool.pyo3-stub-gen]
output-dir = "."
